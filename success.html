<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Ticket · Plantain Boy Experience</title><link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>@media print{nav,.btn,#p{display:none!important}body{background:#fff;color:#000}.t{border:1px solid #000}}.rc{background:#111;border:2px dashed var(--y);border-radius:20px;max-width:420px;margin:0 auto;padding:18px 22px;text-align:left;line-height:2}.rc b{color:var(--y)}@media print{.rc{background:#fff;color:#000}.rc b{color:#000}}body{padding:40px 16px;text-align:center}.t{background:var(--cream);color:#000;border-radius:24px;max-width:420px;margin:18px auto;padding:22px;text-align:left}.t img.q{width:180px;margin:12px auto;border-radius:10px;border:1px solid #ddd}.t h3{font-family:'Bagel Fat One';font-weight:400;font-size:30px}.t code{font-size:20px;font-weight:700;letter-spacing:2px;display:block;text-align:center}</style></head>
<body>
<img src="img/logo.png" style="width:180px;margin:0 auto">
<h1 class="d" id="h" style="font-size:40px;margin-top:10px">Confirming your payment…</h1>
<p id="p" style="color:var(--mut);margin:10px 0 24px">Please wait a moment.</p>
<div id="rc"></div>
<div id="out"></div>
<button class="btn ghost" id="prt" style="display:none;margin-top:14px" onclick="print()">Download / Print receipt</button>
<a href="/" class="btn" style="margin-top:20px">Back to home</a>
<script>
const ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref');
async function go(n){
  if(!ref){h.textContent='No payment found';p.textContent='';return}
  try{
    const first=!sessionStorage['sent_'+ref];const r=await fetch('/api/verify?reference='+encodeURIComponent(ref)+(first?'&send=1':''));const j=await r.json();
    if(!r.ok){if(n<5){setTimeout(()=>go(n+1),2500);return}throw 0}
    if(first)sessionStorage['sent_'+ref]=1;
    h.textContent=`You're in, ${j.name.split(' ')[0]}!`;
    p.textContent=`We've emailed your ticket to ${j.email} from BLAKMIXED ENT. Screenshot the QR code below as a backup.`;
    rc.innerHTML=`<div class="rc"><b>RECEIPT</b><br>Reference: <b>${j.reference}</b><br>Name: ${j.name}<br>Email: ${j.email}<br>Ticket: ${j.qty} × ${j.tier}<br>Amount paid: <b>₦${Number(j.amount).toLocaleString('en-NG')}</b><br>Status: Paid<br>Event: Plantain Boy Experience · 27 Dec 2026</div>`;prt.style.display='inline-block';
    out.innerHTML=j.tickets.map(t=>`<div class="t"><small>TICKET ${t.index} OF ${j.qty}</small><h3>${j.tier}</h3><div>${j.name}</div><img class="q" src="${t.qr}" alt="QR"><code>${t.code}</code><small style="display:block;text-align:center;color:#666">Show this QR at the gate</small></div>`).join('');
  }catch{h.textContent='Payment not confirmed';p.textContent='If you were charged, contact us with reference '+ref+'.'}
}
go(0);
</script><a class="wa" href="https://wa.me/2349027644878?text=Hello%2C%20I%20have%20a%20question%20about%20Plantain%20Boy%20Experience" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 32 32" width="30" height="30" fill="#fff" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.38 4 15c0 2.12.56 4.18 1.62 6L4 29l8.2-1.58A12.05 12.05 0 0 0 16.04 27C22.67 27 28 21.62 28 15S22.67 3 16.04 3zm0 21.9c-1.8 0-3.56-.48-5.1-1.4l-.37-.22-4.87.94.98-4.74-.24-.39A9.8 9.8 0 0 1 6.2 15c0-5.42 4.43-9.82 9.85-9.82 5.43 0 9.76 4.4 9.76 9.82s-4.33 9.9-9.77 9.9zm5.4-7.35c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.5s1.08 2.9 1.23 3.1c.15.2 2.1 3.2 5.08 4.5.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.4.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/></svg></a>
</body></html>
